  <path d="M380,325 H470" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380,470 H690" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380,505 H690" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380,698 H540" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380,733 H540" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380,835 H690" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <text x="386" y="133" font-size="16" fill="#444" stroke="none">Instr 25..0</text>
  <text x="386" y="318" font-size="16" fill="#444" stroke="none">op, funct</text>
  <text x="386" y="463" font-size="16" fill="#444" stroke="none">Instr 25..21</text>
  <text x="386" y="498" font-size="16" fill="#444" stroke="none">Instr 20..16</text>
  <text x="386" y="691" font-size="16" fill="#444" stroke="none">Instr 20..16</text>
  <text x="386" y="726" font-size="16" fill="#444" stroke="none">Instr 15..11</text>
  <text x="386" y="828" font-size="16" fill="#444" stroke="none">Instr 15..0</text>

  <!-- jump target -->
  <path d="M590,140 H1255 V265 H1290" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <text x="700" y="132" font-size="17" fill="#444" stroke="none">jump target address</text>

  <!-- read data 1 -->
  <path d="M880,495 H1010" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="960" cy="495" r="5" fill="#1a1a1a" stroke="none"/>
  <path d="M960,495 V395 H1370 V295 H1400" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1000" y="387" font-size="19" font-weight="bold" fill="#c0392b" stroke="none">Read data 1 ($ra for jr)</text>

  <!-- read data 2 -->
  <path d="M880,545 H950" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="925" cy="545" r="5" fill="#1a1a1a" stroke="none"/>
  <path d="M925,545 V660 H1170 V545 H1230" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <text x="975" y="681" font-size="17" fill="#444" stroke="none">write data to memory</text>

  <!-- sign extend -->
  <path d="M810,835 H950" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="900" cy="835" r="5" fill="#1a1a1a" stroke="none"/>
  <path d="M900,835 V585 H950" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1060,835 H1110" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M990,565 H1010" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>

  <!-- ALU result -->
  <path d="M1130,515 H1145 V390 H1420 V442 H1440" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="1145" cy="460" r="5" fill="#1a1a1a" stroke="none"/>
  <path d="M1145,460 H1230" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <text x="1152" y="452" font-size="16" fill="#444" stroke="none">address</text>
  <text x="1258" y="383" font-size="17" fill="#444" stroke="none">ALU result</text>

  <!-- data memory read data -->
  <path d="M1380,460 H1400 V478 H1440" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>

  <path d="M1480,460 V478 H1520" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>

