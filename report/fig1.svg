  <text x="700" y="550" font-size="16" fill="#333" stroke="none">Rd reg 2</text>
  <text x="700" y="583" font-size="16" fill="#333" stroke="none">Wr reg</text>
  <text x="700" y="613" font-size="16" fill="#333" stroke="none">Wr data</text>
  <text x="872" y="500" text-anchor="end" font-size="16" fill="#333" stroke="none">Rd data 1</text>
  <text x="872" y="550" text-anchor="end" font-size="16" fill="#333" stroke="none">Rd data 2</text>

  <rect x="1010" y="460" width="120" height="140" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1070" y="538" text-anchor="middle" font-size="24" font-weight="bold" fill="#111" stroke="none">ALU</text>

  <rect x="1230" y="420" width="150" height="160" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1305" y="494" text-anchor="middle" font-size="22" font-weight="bold" fill="#111" stroke="none">Data</text>
  <text x="1305" y="520" text-anchor="middle" font-size="22" font-weight="bold" fill="#111" stroke="none">memory</text>

  <rect x="690" y="810" width="120" height="50" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
