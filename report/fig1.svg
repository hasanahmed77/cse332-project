  <path d="M1560,460 H1620 V900 H620 V595 H690" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1010" y="892" font-size="19" font-weight="bold" fill="#c0392b" stroke="none">write data returns to the register file</text>

  <!-- write register path -->
  <path d="M580,715 H600 V698 H630" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M610,782 V733 H630" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="528" y="800" font-size="18" font-weight="bold" fill="#c0392b" stroke="none">31 ($ra)</text>
  <path d="M670,715 H680 V555 H690" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- branch target -->
  <path d="M1200,822 H1215 V300 H1160 V235 H1180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <text x="1226" y="704" font-size="17" fill="#444" stroke="none">branch target</text>

  <!-- mux chain -->
  <path d="M1225,205 H1290" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1335,235 H1400" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1445,265 H1700 V990 H30 V515 H60" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <text x="830" y="982" font-size="20" fill="#444" stroke="none">next PC</text>

  <!-- ================= NEW CONTROL LINES ================= -->
  <path d="M610,370 H628 V790 H650 V750" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="662" y="806" font-size="19" font-weight="bold" fill="#c0392b" stroke="none">JAL</text>
  <path d="M610,355 H1540 V425" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1566" y="440" font-size="19" font-weight="bold" fill="#c0392b" stroke="none">JAL</text>
  <path d="M610,340 H1422 V320" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1450" y="336" font-size="19" font-weight="bold" fill="#c0392b" stroke="none">JR</text>

  <!-- ================= EXISTING CONTROL STUBS ================= -->
  <path d="M560,772 V750" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="452" y="778" font-size="18" fill="#1f5fa8" stroke="none">RegDst</text>
  <path d="M970,618 V603" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="936" y="638" font-size="18" fill="#1f5fa8" stroke="none">ALUSrc</text>
  <path d="M1460,512 V495" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="1396" y="530" font-size="18" fill="#1f5fa8" stroke="none">MemtoReg</text>
  <path d="M785,412 V430" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="736" y="406" font-size="18" fill="#1f5fa8" stroke="none">RegWrite</text>
  <path d="M1305,598 V580" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="1252" y="616" font-size="18" fill="#1f5fa8" stroke="none">MemWrite</text>
  <path d="M1202,132 V150" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="1168" y="126" font-size="18" fill="#1f5fa8" stroke="none">PCSrc</text>
  <path d="M1312,162 V180" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="1284" y="156" font-size="18" fill="#1f5fa8" stroke="none">Jump</text>

  <!-- ================= LEGEND ================= -->
  <rect x="66" y="620" width="286" height="152" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
  <path d="M82,648 H122" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="132" y="654" font-size="18" fill="#333" stroke="none">existing datapath</text>
  <path d="M82,680 H122" stroke="#1f5fa8" stroke-width="2.5"/>
  <text x="132" y="686" font-size="18" fill="#1f5fa8" stroke="none">existing control</text>
  <path d="M82,712 H122" stroke="#c0392b" stroke-width="3"/>
  <text x="132" y="718" font-size="18" font-weight="bold" fill="#c0392b" stroke="none">new for JAL and JR</text>
  <circle cx="102" cy="742" r="5" fill="#1a1a1a" stroke="none"/>
  <text x="132" y="748" font-size="18" fill="#333" stroke="none">wires joined</text>

  <!-- control note -->
  <rect x="150" y="256" width="212" height="86" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.5"/>
  <text x="162" y="280" font-size="17" font-weight="bold" fill="#c0392b" stroke="none">The control unit gains</text>
  <text x="162" y="302" font-size="17" font-weight="bold" fill="#c0392b" stroke="none">two new outputs,</text>
  <text x="162" y="324" font-size="17" font-weight="bold" fill="#c0392b" stroke="none">JAL and JR</text>

  <!-- ================= FOOTNOTE ================= -->
  <rect x="66" y="1000" width="1644" height="54" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
  <text x="80" y="1022" font-size="19" fill="#222" stroke="none" font-weight="bold">JAL sends register 31 to the write register port and PC+4 to the write data port, and it also raises Jump so the target address is taken.</text>
  <text x="80" y="1044" font-size="19" fill="#222" stroke="none" font-weight="bold">JR sends Read data 1 straight to the PC, which overrides the sequential, branch and jump choices made by the earlier muxes.</text>

  </g>
</svg>
