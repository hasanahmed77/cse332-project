  <text x="270" y="542" text-anchor="middle" font-size="22" font-weight="bold" fill="#111" stroke="none">memory</text>

  <rect x="300" y="150" width="90" height="80" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
