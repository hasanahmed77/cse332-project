  <text x="650" y="728" text-anchor="middle" font-size="15" fill="#c0392b" stroke="none">U</text>

  <polygon points="950,527 950,603 990,591 990,539" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
  <text x="970" y="559" text-anchor="middle" font-size="15" fill="#333" stroke="none">M</text>
  <text x="970" y="575" text-anchor="middle" font-size="15" fill="#333" stroke="none">U</text>

  <polygon points="1440,425 1440,495 1480,483 1480,437" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1460" y="457" text-anchor="middle" font-size="15" fill="#333" stroke="none">M</text>
  <text x="1460" y="473" text-anchor="middle" font-size="15" fill="#333" stroke="none">U</text>

  <polygon points="1520,425 1520,495 1560,483 1560,437" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
  <text x="1540" y="457" text-anchor="middle" font-size="15" fill="#c0392b" stroke="none">M</text>
  <text x="1540" y="473" text-anchor="middle" font-size="15" fill="#c0392b" stroke="none">U</text>

  <polygon points="1180,150 1180,260 1225,244 1225,166" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1202" y="199" text-anchor="middle" font-size="15" fill="#333" stroke="none">M</text>
  <text x="1202" y="215" text-anchor="middle" font-size="15" fill="#333" stroke="none">U</text>

  <polygon points="1290,180 1290,290 1335,274 1335,196" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1312" y="229" text-anchor="middle" font-size="15" fill="#333" stroke="none">M</text>
  <text x="1312" y="245" text-anchor="middle" font-size="15" fill="#333" stroke="none">U</text>

  <polygon points="1400,210 1400,320 1445,304 1445,226" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
  <text x="1422" y="259" text-anchor="middle" font-size="15" fill="#c0392b" stroke="none">M</text>
  <text x="1422" y="275" text-anchor="middle" font-size="15" fill="#c0392b" stroke="none">U</text>

  <!-- ================= WIRES ================= -->
  <path d="M125,515 H200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M160,515 V172 H300" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="160" cy="515" r="5" fill="#1a1a1a" stroke="none"/>
  <path d="M258,208 H300" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <text x="238" y="214" font-size="20" fill="#333" stroke="none">4</text>

  <!-- PC+4 bus -->
  <path d="M390,190 V95 H1500" stroke="#1a1a1a" stroke-width="2"/>
  <text x="700" y="87" font-size="20" fill="#444" stroke="none">PC + 4</text>
  <circle cx="430" cy="95" r="5" fill="#1a1a1a" stroke="none"/>
  <path d="M430,95 V760 H1090 V795 H1110" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="1150" cy="95" r="5" fill="#1a1a1a" stroke="none"/>
  <path d="M1150,95 V175 H1180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1500,95 V442 H1520" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1506" y="414" font-size="18" font-weight="bold" fill="#c0392b" stroke="none">PC+4</text>

  <!-- instruction trunk -->
  <path d="M340,515 H380" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M380,140 V835" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="380" cy="515" r="5" fill="#1a1a1a" stroke="none"/>
  <circle cx="380" cy="140" r="5" fill="#1a1a1a" stroke="none"/>
  <circle cx="380" cy="325" r="5" fill="#1a1a1a" stroke="none"/>
  <circle cx="380" cy="470" r="5" fill="#1a1a1a" stroke="none"/>
  <circle cx="380" cy="505" r="5" fill="#1a1a1a" stroke="none"/>
  <circle cx="380" cy="698" r="5" fill="#1a1a1a" stroke="none"/>
  <circle cx="380" cy="733" r="5" fill="#1a1a1a" stroke="none"/>
  <circle cx="380" cy="835" r="5" fill="#1a1a1a" stroke="none"/>
