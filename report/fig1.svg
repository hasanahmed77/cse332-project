<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1780 1000" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="60" width="1780" height="1000" fill="white"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
